<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문의 · 프롬프트 랩</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body data-root="../..">
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><div class="container narrow-lg">
      <p class="eyebrow">CONTACT</p>
      <h1>상담은 무료입니다</h1>
      <p class="lead">남겨 주시면 영업일 기준 이틀 안에 회신드립니다. (예제용 가상 일정)</p>
      <form class="form" data-form novalidate>
        <label>이름<input name="name" type="text" required></label>
        <label>이메일<input name="email" type="email" placeholder="you@example.com" required></label>
        <label>문의 내용<textarea name="msg" required></textarea></label>
        <button class="btn btn-primary" type="submit">보내기</button>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
